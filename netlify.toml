# Déploiement Netlify : l'application est dans le sous-dossier conges-app.
# Variables à définir dans Netlify (Site configuration → Environment variables) :
#   SESSION_SECRET   (48 caractères aléatoires, voir conges-app/.env.example)
#   CONGES_STOCKAGE = blobs
[build]
  base = "conges-app"
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"

# Runtime Next.js de Netlify : transforme les pages dynamiques et les routes
# /api en fonctions serveur. Sans lui, seuls des fichiers statiques sont mis
# en ligne et le site répond 404.
[[plugins]]
  package = "@netlify/plugin-nextjs"
